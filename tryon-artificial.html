<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Try-On Artificial Jewelry</title>
  <style>
    body { margin: 0; overflow: hidden; background: #000; }
    video, canvas {
      position: absolute;
      top: 0;
      left: 0;
    }
    .btn-back {
      position: absolute;
      top: 15px;
      left: 15px;
      z-index: 10;
      background: white;
      color: black;
      padding: 10px 15px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>
<body>

<a href="javascript:history.back()" class="btn-back">← Back</a>

<video id="camera" autoplay muted playsinline width="640" height="480"></video>
<canvas id="overlay" width="640" height="480"></canvas>

<!-- Load MediaPipe libraries -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

<script>
  const params = new URLSearchParams(window.location.search);
  const imageSrc = params.get("image") || "images/default.png";
  const category = params.get("category") || "";

  const video = document.getElementById("camera");
  const canvas = document.getElementById("overlay");
  const ctx = canvas.getContext("2d");

  const jewelryImg = new Image();
  jewelryImg.src = imageSrc;

  const camera = new Camera(video, {
    onFrame: async () => {
      if (category === "ring") {
        await hands.send({ image: video });
      } else if (category === "necklace") {
        await faceMesh.send({ image: video });
      } else if (category === "bangle") {
        await pose.send({ image: video });
      }
    },
    width: 640,
    height: 480,
  });

  // Ring Detection (Hands)
  const hands = new Hands({
    locateFile: (file) =>
      `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`,
  });

  hands.setOptions({
    maxNumHands: 2,
    modelComplexity: 1,
    minDetectionConfidence: 0.7,
    minTrackingConfidence: 0.7,
  });

  hands.onResults((results) => {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(results.image, 0, 0, canvas.width, canvas.height);

    if (results.multiHandLandmarks && category === "ring") {
      results.multiHandLandmarks.forEach((landmarks) => {
        const base = landmarks[13];
        const tip = landmarks[14];

        const x = base.x * canvas.width + 5;
        const y = base.y * canvas.height + 10;
        const dx = (tip.x - base.x) * canvas.width;
        const dy = (tip.y - base.y) * canvas.height;
        const angle = Math.atan2(dy, dx);

        const width = 50;
        const height = 30;

        if (jewelryImg.complete) {
          ctx.save();
          ctx.translate(x, y);
          ctx.rotate(angle - Math.PI / 2);
          ctx.drawImage(jewelryImg, -width / 2, -height / 2, width, height);
          ctx.restore();
        }
      });
    }
  });

  // Necklace Detection (FaceMesh)
  const faceMesh = new FaceMesh({
    locateFile: (file) =>
      `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`,
  });

  faceMesh.setOptions({
    maxNumFaces: 1,
    refineLandmarks: true,
    minDetectionConfidence: 0.7,
    minTrackingConfidence: 0.7,
  });

  faceMesh.onResults((results) => {
    if (category !== "necklace") return;

    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(results.image, 0, 0, canvas.width, canvas.height);

    if (results.multiFaceLandmarks.length > 0 && jewelryImg.complete) {
      const landmarks = results.multiFaceLandmarks[0];
      const chin = landmarks[152];
      const leftNeck = landmarks[127];
      const rightNeck = landmarks[356];

      const x1 = leftNeck.x * canvas.width;
      const x2 = rightNeck.x * canvas.width;
      const centerX = (x1 + x2) / 2;
      const centerY = chin.y * canvas.height + 20;

      const width = Math.abs(x2 - x1) * 1.6;
      const height = width * 0.6;

      ctx.drawImage(jewelryImg, centerX - width / 2, centerY - height / 2, width, height);
    }
  });

  // Bangle Detection (Pose)
  const pose = new Pose({
    locateFile: (file) =>
      `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`,
  });

  pose.setOptions({
    modelComplexity: 1,
    smoothLandmarks: true,
    enableSegmentation: false,
    minDetectionConfidence: 0.6,
    minTrackingConfidence: 0.6,
  });

  pose.onResults((results) => {
    if (category !== "bangle") return;

    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(results.image, 0, 0, canvas.width, canvas.height);

    if (results.poseLandmarks && jewelryImg.complete) {
      const lm = results.poseLandmarks;
      const wrist = lm[15]; // Right wrist
      const elbow = lm[13]; // Right elbow

      if (wrist && elbow) {
        const x = wrist.x * canvas.width;
        const y = wrist.y * canvas.height;

        const dx = (elbow.x - wrist.x) * canvas.width;
        const dy = (elbow.y - wrist.y) * canvas.height;
        const angle = Math.atan2(dy, dx);

        const width = 60;
        const height = 40;

        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(angle - Math.PI / 2);
        ctx.drawImage(jewelryImg, -width / 2, -height / 2, width, height);
        ctx.restore();
      }
    }
  });

  // Start camera
  camera.start();
</script>

</body>
</html>
