<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Virtual Try-On - Necklace (Tilt Aware)</title>
  <style>
    body { margin: 0; overflow: hidden; background: #000; }
    video, canvas { position: absolute; top: 0; left: 0; }
    .btn-back {
      position: absolute;
      top: 15px;
      left: 15px;
      z-index: 10;
      background: white;
      color: black;
      padding: 10px 15px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>
<body>

<a href="javascript:history.back()" class="btn-back">← Back</a>

<video id="camera" autoplay muted playsinline width="640" height="480"></video>
<canvas id="overlay" width="640" height="480"></canvas>

<!-- MediaPipe -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

<script>
  const video = document.getElementById('camera');
  const canvas = document.getElementById('overlay');
  const ctx = canvas.getContext('2d');

  const params = new URLSearchParams(window.location.search);
  const imageSrc = params.get("image") || "images/default_necklace.png";

  const necklaceImg = new Image();
  necklaceImg.src = imageSrc;

  const faceMesh = new FaceMesh({
    locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
  });

  faceMesh.setOptions({
    maxNumFaces: 1,
    refineLandmarks: true,
    minDetectionConfidence: 0.7,
    minTrackingConfidence: 0.7
  });

  faceMesh.onResults((results) => {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(results.image, 0, 0, canvas.width, canvas.height);

    if (results.multiFaceLandmarks.length > 0 && necklaceImg.complete) {
      const landmarks = results.multiFaceLandmarks[0];

      const leftJaw = landmarks[234];
      const rightJaw = landmarks[454];
      const chin = landmarks[152];

      const x1 = leftJaw.x * canvas.width;
      const y1 = leftJaw.y * canvas.height;
      const x2 = rightJaw.x * canvas.width;
      const y2 = rightJaw.y * canvas.height;

      const centerX = (x1 + x2) / 2;
      const chinY = chin.y * canvas.height;

      const necklaceY = chinY + 50; // 👈 OFFSET TO DROP BELOW CHIN (ON NECK)

      const necklaceWidth = Math.abs(x2 - x1) * 1.6;
      const necklaceHeight = necklaceWidth * 0.45;

      const angle = Math.atan2(y2 - y1, x2 - x1);

      ctx.save();
      ctx.translate(centerX, necklaceY);
      ctx.rotate(angle);
      ctx.drawImage(
        necklaceImg,
        -necklaceWidth / 2,
        -necklaceHeight / 2,
        necklaceWidth,
        necklaceHeight
      );
      ctx.restore();
    }
  });

  const camera = new Camera(video, {
    onFrame: async () => {
      await faceMesh.send({ image: video });
    },
    width: 640,
    height: 480
  });

  camera.start();
</script>

</body>
</html>
